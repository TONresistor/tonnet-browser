<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f5f5f5;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --text-muted: rgba(255, 255, 255, 0.4);
      --surface-hover: rgba(255, 255, 255, 0.08);
      --surface-active: rgba(255, 255, 255, 0.12);
      --primary: #0098ea;
      --separator: rgba(255, 255, 255, 0.08);
      --radius: 14px;
      --blur: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: var(--text);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #root {
      background: var(--bg);
      backdrop-filter: blur(var(--blur)) saturate(1.4);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      overflow: hidden;
      max-height: 100%;
      overflow-y: auto;
    }

    #root:empty {
      display: none;
    }

    /* Scrollbar */
    #root::-webkit-scrollbar { width: 6px; }
    #root::-webkit-scrollbar-track { background: transparent; }
    #root::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }

    /* Suggestion items */
    .suggestion-item {
      display: flex;
      flex-direction: column;
      padding: 8px 12px;
      cursor: pointer;
      transition: background 80ms;
    }

    .suggestion-item:hover,
    .suggestion-item.selected {
      background: var(--surface-hover);
    }

    .suggestion-item:active {
      background: var(--surface-active);
    }

    .suggestion-title {
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .suggestion-url {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .suggestion-visits {
      font-size: 10px;
      color: var(--text-muted);
      margin-left: auto;
      flex-shrink: 0;
    }

    .suggestion-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Menu items */
    .menu-item {
      display: flex;
      align-items: center;
      padding: 9px 14px;
      margin: 2px 4px;
      cursor: pointer;
      font-size: 13px;
      border-radius: 8px;
      transition: background 80ms;
    }

    .menu-item:hover,
    .menu-item.selected {
      background: var(--surface-hover);
    }

    .menu-item:active {
      background: var(--surface-active);
    }

    .menu-item.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .menu-separator {
      height: 1px;
      background: var(--separator);
      margin: 4px 0;
    }

    .menu-icon {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      opacity: 0.7;
    }

    .menu-item.destructive {
      color: #ff453a;
    }

    #root.find-mode {
      border-radius: 12px;
      overflow: hidden;
    }

    .find-container {
      height: 46px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px 6px 12px;
    }

    .find-input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      user-select: text;
      -webkit-user-select: text;
    }

    .find-input::placeholder {
      color: var(--text-muted);
    }

    .find-count {
      min-width: 42px;
      color: var(--text-secondary);
      font-size: 11px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .find-button {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    .find-button:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .find-button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    /* Form */
    .form-container {
      padding: 20px;
    }

    .form-title {
      font-weight: bold;
      color: var(--text);
      margin-bottom: 16px;
      font-size: 14px;
    }

    .form-field {
      margin-bottom: 12px;
    }

    .form-label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      display: block;
    }

    .form-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      box-sizing: border-box;
      transition: border-color 120ms;
    }

    .form-input:focus {
      border-color: var(--primary);
    }

    .form-readonly {
      opacity: 0.8;
      cursor: default;
      font-size: 12px;
      line-height: 1.5;
      white-space: normal;
      border: none;
      background: transparent;
      padding: 0;
    }

    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .form-btn {
      flex: 1;
      padding: 10px 0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: all 150ms;
    }

    .form-btn-secondary {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .form-btn-secondary:hover {
      color: var(--text);
    }

    .form-btn-primary {
      background: rgba(0, 152, 234, 0.9);
      color: var(--text);
      box-shadow: 0 4px 12px rgba(0, 152, 234, 0.4);
    }

    .form-btn-primary:hover {
      transform: scale(1.02);
    }

    #root.modal-mode {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: none;
      box-shadow: none;
      border-radius: 0;
      overflow: visible;
    }

    .tc-scrim {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px) saturate(1.2);
      -webkit-backdrop-filter: blur(6px) saturate(1.2);
      animation: tc-fade 140ms ease-out;
    }

    .tc-card {
      width: 344px;
      max-width: calc(100vw - 40px);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: hsl(210 26% 13%);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 20px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      padding: 22px 18px 18px;
      text-align: center;
      animation: tc-pop 180ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }

    @keyframes tc-fade { from { opacity: 0 } to { opacity: 1 } }
    @keyframes tc-pop {
      from { opacity: 0; transform: translateY(8px) scale(0.96) }
      to { opacity: 1; transform: none }
    }

    .tc-icon {
      width: 56px; height: 56px; border-radius: 16px;
      object-fit: cover; display: block; margin: 0 auto 12px;
      background: rgba(255, 255, 255, 0.06);
    }
    .tc-icon-fallback {
      width: 56px; height: 56px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;
      background: rgba(0, 152, 234, 0.16); font-size: 26px;
    }
    .tc-icon-ton {
      width: 56px; height: 56px; display: flex; align-items: center;
      justify-content: center; margin: 0 auto 12px;
    }

    .tc-title { font-size: 17px; font-weight: 600; color: var(--text); }
    .tc-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 3px; }
    .tc-domain {
      display: inline-flex; align-items: center; gap: 5px; margin-top: 8px;
      padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.06);
      font-size: 12px; color: rgba(255, 255, 255, 0.75);
      font-family: ui-monospace, SFMono-Regular, monospace;
    }
    .tc-domain svg { width: 12px; height: 12px; color: #30d158; flex-shrink: 0; }
    .tc-amount {
      font-size: 32px; font-weight: 720; color: var(--text);
      margin: 16px 0 2px; letter-spacing: -0.6px;
    }
    .tc-amount .unit { font-size: 18px; font-weight: 600; color: var(--text-secondary); margin-left: 5px; }

    .tc-warning {
      margin-top: 14px; padding: 10px 12px; text-align: left;
      background: rgba(255, 170, 0, 0.14);
      border: 1px solid rgba(255, 170, 0, 0.32);
      border-radius: 12px;
      color: #ffcf66; font-size: 12px; line-height: 1.4;
    }

    .tc-rows {
      margin-top: 16px; text-align: left;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 14px; overflow: hidden;
    }
    .tc-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
    .tc-row + .tc-row { border-top: 1px solid rgba(255, 255, 255, 0.06); }
    .tc-row-label { font-size: 13px; color: var(--text-secondary); flex-shrink: 0; }
    .tc-row-value {
      font-size: 13px; color: var(--text); margin-left: auto;
      text-align: right; word-break: break-all;
    }

    .tc-actions { display: flex; gap: 10px; margin-top: 20px; }
    .tc-btn {
      flex: 1; padding: 13px 0; border-radius: 14px;
      font-size: 15px; font-weight: 600; font-family: inherit;
      cursor: pointer; border: none; transition: transform 120ms, background 120ms, filter 120ms;
    }
    .tc-btn:active { transform: scale(0.97); }
    .tc-btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    .tc-btn-secondary:hover { background: rgba(255, 255, 255, 0.12); }
    .tc-btn-primary { background: var(--primary); color: #fff; }
    .tc-btn-primary:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="overlay.js"></script>
</body>
</html>
